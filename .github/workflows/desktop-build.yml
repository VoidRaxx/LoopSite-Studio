name: Desktop build checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Validate desktop icons
        run: python scripts/verify-icons.py
      - run: npm install
      - run: npm run build
      - run: cd src-tauri && cargo test
      - name: Build native installers
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: npm run tauri build
      - name: Upload experimental Windows installer
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: loopsite-windows-experimental
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
      - name: Upload experimental Linux packages
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: loopsite-linux-experimental
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14
