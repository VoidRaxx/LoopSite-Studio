name: Desktop build checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev mariadb-client
      - name: Validate desktop icons
        run: python scripts/verify-icons.py
      - name: Validate palette consistency and contrast
        run: python scripts/verify-themes.py
      - name: Enforce manual release and portable build policy
        run: node scripts/verify-release-policy.mjs
      - name: Verify version and release candidate changelog
        run: node scripts/verify-release-candidate.mjs
      - run: npm install
      - run: npm run test:languages
      - run: npm run build
      - name: Set up PHP 8.4 for Windows router smoke test
        if: runner.os == 'Windows'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Rust tests and PHP router smoke test
        env:
          LOOPSITE_TEST_PHP: php
        run: cd src-tauri && cargo test
      - name: Start isolated MariaDB test container
        if: runner.os == 'Linux'
        run: |
          docker run -d --name loopsite-mariadb-ci -p 127.0.0.1:3307:3306 \
            -e MARIADB_ROOT_PASSWORD=LoopSiteCiTestOnly123 \
            -e MARIADB_ROOT_HOST=% mariadb:11.4
          # Wait for authentication on the actual host-mapped TCP socket,
          # not merely docker exec ping over the container's Unix socket.
          for attempt in $(seq 1 60); do
            if MYSQL_PWD=LoopSiteCiTestOnly123 mariadb --protocol=tcp \
              --host=127.0.0.1 --port=3307 --user=root \
              --execute="SELECT 1;" >/dev/null 2>&1; then
              echo "MariaDB TCP connection is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs loopsite-mariadb-ci
          exit 1
      - name: MariaDB end-to-end integration test
        if: runner.os == 'Linux'
        env:
          LOOPSITE_CI_MARIA_PORT: '3307'
          LOOPSITE_CI_MARIA_PASSWORD: LoopSiteCiTestOnly123
        run: cd src-tauri && cargo test real_mariadb_integration_when_configured
      # CI validates every format but does NOT publish downloadable installers.
      # Only a manually approved release workflow may upload distributable files.
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: npx tauri build --bundles nsis
      - name: Build Windows fully portable executable
        if: runner.os == 'Windows'
        env:
          LOOPSITE_PORTABLE: '1'
          CARGO_BUILD_JOBS: '2'
        run: npx tauri build --no-bundle --config src-tauri/tauri.portable.conf.json
      - name: Validate Windows installer and portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')) { throw 'Missing NSIS installer' }
          if (-not (Test-Path 'src-tauri/target/release/loopsite-studio.exe')) { throw 'Missing portable exe' }
          Write-Host 'NSIS installer and portable executable built successfully; no downloadable artifacts published.'
      - name: Build Linux DEB and RPM installers
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: npx tauri build --bundles deb,rpm
      - name: Build Linux Portable AppImage
        if: runner.os == 'Linux'
        env:
          LOOPSITE_PORTABLE: '1'
          CARGO_BUILD_JOBS: '2'
        run: npx tauri build --bundles appimage --config src-tauri/tauri.portable.conf.json
      - name: Validate Linux packages and portable AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src-tauri/target/release/bundle/deb -name '*.deb' | wc -l)" -gt 0
          test "$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | wc -l)" -gt 0
          test "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | wc -l)" -gt 0
          echo "DEB, RPM and portable AppImage passed packaging; no downloadable artifacts published."
