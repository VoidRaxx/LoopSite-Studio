name: Desktop build checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev mariadb-client
      - name: Validate desktop icons
        run: python scripts/verify-icons.py
      - name: Validate palette consistency and contrast
        run: python scripts/verify-themes.py
      - run: npm install
      - run: npm run build
      - name: Set up PHP 8.4 for Windows router smoke test
        if: runner.os == 'Windows'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Rust tests and PHP router smoke test
        env:
          LOOPSITE_TEST_PHP: php
        run: cd src-tauri && cargo test
      - name: Start isolated MariaDB test container
        if: runner.os == 'Linux'
        run: |
          docker run -d --name loopsite-mariadb-ci -p 127.0.0.1:3307:3306 \
            -e MARIADB_ROOT_PASSWORD=LoopSiteCiTestOnly123 \
            -e MARIADB_ROOT_HOST=% mariadb:11.4
          # Wait for authentication on the actual host-mapped TCP socket,
          # not merely docker exec ping over the container's Unix socket.
          for attempt in $(seq 1 60); do
            if MYSQL_PWD=LoopSiteCiTestOnly123 mariadb --protocol=tcp \
              --host=127.0.0.1 --port=3307 --user=root \
              --execute="SELECT 1;" >/dev/null 2>&1; then
              echo "MariaDB TCP connection is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs loopsite-mariadb-ci
          exit 1
      - name: MariaDB end-to-end integration test
        if: runner.os == 'Linux'
        env:
          LOOPSITE_CI_MARIA_PORT: '3307'
          LOOPSITE_CI_MARIA_PASSWORD: LoopSiteCiTestOnly123
        run: cd src-tauri && cargo test real_mariadb_integration_when_configured
      - name: Build native installers
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: npm run tauri build
      - name: Upload experimental Windows installer
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: loopsite-windows-experimental
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
      - name: Upload experimental Linux packages
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: loopsite-linux-experimental
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14
