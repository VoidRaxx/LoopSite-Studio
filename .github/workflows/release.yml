name: Approved official release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Approved version tag, for example v0.2.0-experimental.1 (created automatically)"
        required: true
        type: string
      approval:
        description: "Type APPROVE LOOPSITE RELEASE after reviewing the full changelog and package plan."
        required: true
        type: string
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    environment: release-approval
    outputs:
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify approval, version and English changelog
        id: validate
        env:
          REVIEW_APPROVAL: ${{ inputs.approval }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Start the release from main."; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Release checkout differs from the reviewed commit."; exit 1; }
          test "$REVIEW_APPROVAL" = "APPROVE LOOPSITE RELEASE" || { echo "Explicit approval required"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-experimental\.[0-9]+)?$ ]] || exit 1
          test "v$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$RELEASE_TAG"
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)" = "$RELEASE_TAG"
          changelog="release-notes/$RELEASE_TAG.md"
          test -s "$changelog" || { echo "Release requires an approved changelog file"; exit 1; }
          grep -q '^## Added\|^## Changed\|^## Fixed\|^## Security\|^## Known Issues' "$changelog" || exit 1
          ! grep -qi 'TODO\|TBD\|PLACEHOLDER' "$changelog" || exit 1
          if [[ "$RELEASE_TAG" == *-experimental.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flavor: windows
          - os: ubuntu-24.04
            flavor: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev rpm zip
      - run: npm install
      - name: Configure signed update verification
        env:
          LOOPSITE_UPDATER_PUBLIC_KEY: ${{ secrets.LOOPSITE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-signed-updater.mjs
      - run: npm run build
      - name: Build signed Windows NSIS installer
        if: runner.os == 'Windows'
        env:
          LOOPSITE_SIGNED_UPDATES: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis
      - name: Build self-contained Windows Portable EXE
        if: runner.os == 'Windows'
        env:
          LOOPSITE_PORTABLE: '1'
        run: npx tauri build --no-bundle --config src-tauri/tauri.portable.conf.json
      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item release-files -ItemType Directory -Force | Out-Null
          Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe*' | Copy-Item -Destination release-files
          New-Item portable/portable-data -ItemType Directory -Force | Out-Null
          Copy-Item src-tauri/target/release/loopsite-studio.exe portable/LoopSite-Studio.exe
          Set-Content -Path portable/README.txt -Value 'Portable: keep portable-data next to LoopSite-Studio.exe. No installation required.'
          Compress-Archive -Path portable/* -DestinationPath release-files/LoopSite-Studio-Windows-Portable.zip -Force
          if (-not (Get-ChildItem release-files/*-setup.exe)) { throw 'Missing installer' }
          if (-not (Get-ChildItem release-files/*.exe.sig)) { throw 'Missing NSIS signing signature' }
      - name: Build installed Linux DEB, RPM and signed AppImage
        if: runner.os == 'Linux'
        env:
          LOOPSITE_SIGNED_UPDATES: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Stage installed Linux packages and signed manifest assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-files
          find src-tauri/target/release/bundle/deb -name '*.deb' -exec cp -v {} release-files/ \;
          find src-tauri/target/release/bundle/rpm -name '*.rpm' -exec cp -v {} release-files/ \;
          find src-tauri/target/release/bundle/appimage -name '*.AppImage*' -exec cp -v {} release-files/ \;
      - name: Build separate fully portable Linux AppImage
        if: runner.os == 'Linux'
        env:
          LOOPSITE_PORTABLE: '1'
        run: npx tauri build --bundles appimage --config src-tauri/tauri.portable.conf.json
      - name: Package portable Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portable/portable-data
          find src-tauri/target/release/bundle/appimage -name '*.AppImage' -exec cp {} portable/LoopSite-Studio-Portable.AppImage \;
          test -s portable/LoopSite-Studio-Portable.AppImage
          chmod +x portable/LoopSite-Studio-Portable.AppImage
          printf '%s\n' 'Portable: keep portable-data beside the AppImage; run chmod +x *.AppImage if required.' > portable/README.txt
          (cd portable && zip -qr ../release-files/LoopSite-Studio-Linux-Portable.zip .)
          test "$(find release-files -name '*.deb' | wc -l)" -gt 0
          test "$(find release-files -name '*.rpm' | wc -l)" -gt 0
          test "$(find release-files -name '*.AppImage.sig' | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-${{ matrix.flavor }}
          path: release-files/*
          retention-days: 3
          if-no-files-found: error

  arch:
    needs: review
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Arch compilation dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel rust cargo nodejs npm webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg openssl pkgconf
      - run: npm install
      - name: Build Arch-native executable
        run: npx tauri build --no-bundle
      - name: Package for pacman
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/loopsite-arch-pkg
          cp packaging/arch/PKGBUILD packaging/arch/loopsite-studio.desktop /tmp/loopsite-arch-pkg/
          cp src-tauri/target/release/loopsite-studio /tmp/loopsite-arch-pkg/loopsite-studio
          cp src-tauri/icons/icon.png /tmp/loopsite-arch-pkg/loopsite-studio.png
          version="${{ inputs.tag }}"
          version="${version#v}"
          sed -i "s/^pkgver=.*/pkgver=${version//-/_}/" /tmp/loopsite-arch-pkg/PKGBUILD
          useradd --create-home --shell /bin/bash pkgbuild
          chown -R pkgbuild:pkgbuild /tmp/loopsite-arch-pkg
          su -s /bin/bash pkgbuild -c 'cd /tmp/loopsite-arch-pkg && makepkg -f --noconfirm --nodeps'
          mkdir -p release-files
          find /tmp/loopsite-arch-pkg -name '*.pkg.tar.zst' -exec cp {} release-files/ \;
          test "$(find release-files -name '*.pkg.tar.zst' | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-arch
          path: release-files/*.pkg.tar.zst
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [review, build, arch]
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: reviewed-*
          path: approved-files
      - name: Verify complete packages, signed manifests, and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(find approved-files -name '*-setup.exe' | wc -l)" -eq 1
          test "$(find approved-files -name '*.exe.sig' | wc -l)" -eq 1
          test "$(find approved-files -name '*Windows-Portable.zip' | wc -l)" -eq 1
          test "$(find approved-files -name '*.deb' | wc -l)" -gt 0
          test "$(find approved-files -name '*.rpm' | wc -l)" -gt 0
          test "$(find approved-files -name '*.pkg.tar.zst' | wc -l)" -gt 0
          test "$(find approved-files -name '*.AppImage.sig' | wc -l)" -eq 1
          test "$(find approved-files -name '*Linux-Portable.zip' | wc -l)" -eq 1
          cp "release-notes/$RELEASE_TAG.md" release-notes.md
          node scripts/create-update-manifest.mjs approved-files "$RELEASE_TAG" release-notes.md
      - name: Create the exact approved release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          test "$target" = "$GITHUB_SHA" || { echo "Publish checkout differs from reviewed commit."; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite or re-sign it."
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [[ "$existing" == "$target" ]]; then
            echo "Approved tag already points to the reviewed commit."
          elif [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$target" >/dev/null
            echo "Created the exact approved tag after all builds passed."
          elif [[ "$RELEASE_TAG" == "v0.2.0-experimental.1" &&
                  "$existing" == "22e18a1bf766e5b21bf810a3ba7e1cc36707ef88" ]]; then
            # The first attempt made this tag, then failed before releasing any
            # assets because the updater public-key format was incorrect.
            # Recover only this exact known, unpublished failed tag.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f "sha=$target" -F force=true >/dev/null
            echo "Recovered the unpublished tag from the failed first release."
          else
            echo "An existing tag points to a different commit; refusing to retag."
            exit 1
          fi
      - name: Publish approved official stable release or experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it"
            exit 1
          fi
          args=(--title "LoopSite Studio $RELEASE_TAG" --notes-file release-notes.md --draft)
          if [[ "$RELEASE_TAG" == *-experimental.* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
          mapfile -d '' -t files < <(find approved-files -type f -print0)
          gh release upload "$RELEASE_TAG" "${files[@]}" latest.json
          gh release edit "$RELEASE_TAG" --draft=false
