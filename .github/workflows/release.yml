name: Signed desktop release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  signed-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: signed-windows
            bundles: nsis
          - os: ubuntu-24.04
            artifact: signed-linux
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm install
      - name: Validate tag matches application version
        shell: bash
        run: |
          node -e "const v=require('./src-tauri/tauri.conf.json').version; if('v'+v!==process.env.GITHUB_REF_NAME){console.error('Tag and app version disagree');process.exit(1)}"
      - name: Configure trusted updater signing
        env:
          LOOPSITE_UPDATER_PUBLIC_KEY: ${{ secrets.LOOPSITE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-signed-updater.mjs
      - name: Verify frontend
        run: npm run build
      - name: Build signed installer
        env:
          LOOPSITE_SIGNED_UPDATES: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_BUILD_JOBS: '2'
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Upload signed Windows assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed Linux assets
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: signed-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: signed-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-assets
      - name: Prepare draft release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to replace it."
            exit 1
          fi
          if [ -f "release-notes/$tag.md" ]; then
            gh release create "$tag" --draft --title "LoopSite Studio $tag" --notes-file "release-notes/$tag.md"
          else
            gh release create "$tag" --draft --title "LoopSite Studio $tag" --generate-notes
          fi
          gh release view "$tag" --json body --jq '.body' > release-notes.md
          node scripts/create-update-manifest.mjs release-assets "$tag" release-notes.md
      - name: Upload all assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(find release-assets -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" latest.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
