name: Windows experimental installer (manual test)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm install
      - name: Validate Windows per-user install policy
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.windows.nsis.installMode -ne 'currentUser') {
            throw 'Installer must not require administrator rights.'
          }
          if ($config.bundle.createUpdaterArtifacts -eq $true) {
            throw 'Manual test installer must not require signing keys.'
          }
      - name: Validate frontend
        run: npm run build
      - name: Build unsigned NSIS installer (no in-app updater)
        run: npx tauri build --bundles nsis
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
      - name: Validate installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' -ErrorAction Stop)
          if ($files.Count -ne 1 -or $files[0].Length -lt 1000000) {
            throw 'Expected exactly one nonempty Windows NSIS installer.'
          }
      - name: Upload private workflow test artifact (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: LoopSite-Studio-Windows-Experimental-Unsigned-Setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: Build Windows portable executable
        run: npx tauri build --no-bundle --config src-tauri/tauri.portable.conf.json
        env:
          LOOPSITE_PORTABLE: '1'
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/loopsite-studio.exe'
          if (-not (Test-Path $exe)) { throw 'Missing portable Windows executable.' }
          New-Item -ItemType Directory -Force -Path 'portable/portable-data' | Out-Null
          Copy-Item $exe 'portable/LoopSite-Studio.exe'
          Set-Content -Path 'portable/README.txt' -Value 'Portable version: keep portable-data beside LoopSite-Studio.exe. No installation required.'
          Compress-Archive -Path 'portable/*' -DestinationPath 'LoopSite-Studio-Windows-Portable.zip' -Force
          if ((Get-Item 'LoopSite-Studio-Windows-Portable.zip').Length -lt 1000000) { throw 'Portable ZIP is unexpectedly small.' }
      - name: Upload Windows portable test ZIP (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: LoopSite-Studio-Windows-Experimental-Portable
          path: LoopSite-Studio-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 3
