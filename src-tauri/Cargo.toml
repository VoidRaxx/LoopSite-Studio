[package]
name = "loopsite-studio"
version = "0.1.0"
description = "Local development environment desktop app"
authors = ["VoidRaxx"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-opener = "2"
percent-encoding = "2"
mime_guess = "2"

sha2 = "0.10"
rusqlite = { version = "0.43.0", features = ["bundled"] }
