[package]
name = "loopsite-studio"
version = "0.1.0"
description = "Local development environment desktop app"
authors = ["VoidRaxx"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-opener = "2"
percent-encoding = "2"
mime_guess = "2"

sha2 = "0.10"
rusqlite = { version = "0.43.0", features = ["bundled"] }

# Native TCP client, no shell process or external database CLI.
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }

tauri-plugin-clipboard-manager = "2"

# Signed in-app updates are enabled only for release builds configured with a public key.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
